name: Build Phone Mirror APK

# Runs automatically every time you push/upload changes to the repo
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # also lets you click "Run workflow" manually on GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project (no local extraction needed)
        run: unzip -o PhoneMirror.zip -d .

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build debug APK
        working-directory: ./PhoneMirror
        run: gradle assembleDebug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhoneMirror-debug-apk
          path: PhoneMirror/app/build/outputs/apk/debug/app-debug.apk
